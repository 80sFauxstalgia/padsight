<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSCView Overlay</title>
<style>
  /* Fully transparent page: OBS Browser Sources composite it with real alpha, no chroma key needed. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #status {
    position: absolute; left: 8px; bottom: 8px; padding: 4px 8px; border-radius: 4px;
    font: 12px/1.3 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.55); display: none;
  }
  body.show-status #status { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1" height="1"></canvas>
<div id="status">connecting…</div>
<script>
(() => {
  // Usage: http://127.0.0.1:47817/            -> mirrors the theme shown in the VSCView window
  //        ...?theme=steamcontroller2026/default/Full.json  -> pins a theme (path under themes/)
  //        ...&fps=30                         -> render rate for this source
  //        ...&status=1                       -> show connection status (hidden by default for OBS)
  //        ...&align=left|right|top|bottom    -> where to anchor the image inside the source
  const params = new URLSearchParams(location.search);
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  if (params.get('status') === '1') document.body.classList.add('show-status');
  const align = (params.get('align') || '').toLowerCase();
  if (align) canvas.style.objectPosition =
    { left: 'left center', right: 'right center', top: 'center top', bottom: 'center bottom' }[align] || 'center';

  const wsQuery = new URLSearchParams();
  for (const k of ['theme', 'fps']) if (params.has(k)) wsQuery.set(k, params.get(k));
  const wsUrl = `ws://${location.host}/ws${wsQuery.toString() ? '?' + wsQuery : ''}`;

  let pending = null, drawing = false, backoff = 250;

  function setStatus(t) { statusEl.textContent = t; }

  async function drawLatest() {
    if (drawing) return;
    drawing = true;
    try {
      while (pending) {
        const blob = pending; pending = null;
        const bmp = await createImageBitmap(blob);
        if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
          canvas.width = bmp.width; canvas.height = bmp.height;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bmp, 0, 0);
        bmp.close();
      }
    } catch (e) { console.warn(e); }
    drawing = false;
  }

  function connect() {
    setStatus('connecting…');
    const ws = new WebSocket(wsUrl);
    ws.binaryType = 'blob';
    ws.onopen = () => { backoff = 250; setStatus('connected'); };
    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        try {
          const m = JSON.parse(ev.data);
          if (m.type === 'meta') {
            setStatus(`connected · ${m.width}×${m.height}`);
            if (!m.width) ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        } catch {}
        return;
      }
      pending = ev.data;          // newest frame wins; never queue
      drawLatest();
    };
    let opened = false;
    ws.addEventListener('open', () => { opened = true; });
    ws.onclose = () => {
      setStatus('VSCView not running – retrying…');
      if (!opened && params.has('theme')) {
        // The server is up but refused the socket: almost always a wrong theme path.
        fetch('/status.json', { cache: 'no-store' })
          .then(r => { if (r.ok) setStatus(`Theme not found or failed to load: ${params.get('theme')} – retrying…`); })
          .catch(() => {});
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height); // stay transparent while disconnected
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 3000);
    };
    ws.onerror = () => ws.close();
  }
  connect();
})();
</script>
</body>
</html>
