<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PadSight Overlay</title>
<style>
  /* Fully transparent page: OBS Browser Sources composite it with real alpha, no chroma key needed. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .6s ease; }
  body.idle canvas, body.obs-hidden canvas { opacity: 0 !important; }
  #status {
    position: absolute; left: 8px; bottom: 8px; padding: 4px 8px; border-radius: 4px;
    font: 12px/1.3 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.55); display: none;
  }
  body.show-status #status { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1" height="1"></canvas>
<div id="status">connecting…</div>
<script>
(() => {
  // Usage: http://127.0.0.1:47817/            -> follows the controller and theme shown in PadSight
  //        ...?theme=steamcontroller2026/default/Full.json  -> pins a theme (path under themes/)
  //        ...&fps=30                         -> render rate for this source
  //        ...&status=1                       -> show connection status (hidden by default for OBS)
  //        ...&align=left|right|top|bottom    -> where to anchor the image inside the source
  //        ...&idle=8                         -> fade out after 8 s without input, fade back in on input
  //        ...&opacity=0.8                    -> overall opacity (0.1 to 1)
  //        ...&crop=x,y,w,h                   -> show only this part of the theme (theme pixels)
  const params = new URLSearchParams(location.search);
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  if (params.get('status') === '1') document.body.classList.add('show-status');
  const align = (params.get('align') || '').toLowerCase();
  if (align) canvas.style.objectPosition =
    { left: 'left center', right: 'right center', top: 'center top', bottom: 'center bottom' }[align] || 'center';

  const opacity = parseFloat(params.get('opacity'));
  if (opacity >= 0.1 && opacity < 1) canvas.style.opacity = String(opacity);
  const idleSec = parseFloat(params.get('idle')) || 0;
  const crop = (params.get('crop') || '').split(',').map(Number);
  const hasCrop = crop.length === 4 && crop.every(n => Number.isFinite(n) && n >= 0) && crop[2] > 0 && crop[3] > 0;

  // The app only sends a frame when the picture changes, so "no frame for N seconds" means "no input".
  let lastFrame = performance.now();
  if (idleSec > 0) setInterval(() => {
    document.body.classList.toggle('idle', performance.now() - lastFrame > idleSec * 1000);
  }, 200);

  const wsQuery = new URLSearchParams();
  for (const k of ['theme', 'fps', 'preview']) if (params.has(k)) wsQuery.set(k, params.get(k));
  const wsUrl = `ws://${location.host}/ws${wsQuery.toString() ? '?' + wsQuery : ''}`;

  let pending = null, drawing = false, backoff = 250;

  function setStatus(t) { statusEl.textContent = t; }

  async function drawLatest() {
    if (drawing) return;
    drawing = true;
    try {
      while (pending) {
        const blob = pending; pending = null;
        const bmp = await createImageBitmap(blob);
        const [sx, sy, sw, sh] = hasCrop ? crop : [0, 0, bmp.width, bmp.height];
        if (canvas.width !== sw || canvas.height !== sh) {
          canvas.width = sw; canvas.height = sh;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(bmp, sx, sy, sw, sh, 0, 0, sw, sh);
        bmp.close();
        lastFrame = performance.now();
        document.body.classList.remove('idle');
      }
    } catch (e) { console.warn(e); }
    drawing = false;
  }

  function connect() {
    setStatus('connecting…');
    const ws = new WebSocket(wsUrl);
    ws.binaryType = 'blob';
    ws.onopen = () => { backoff = 250; setStatus('connected'); };
    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        try {
          const m = JSON.parse(ev.data);
          if (m.type === 'meta') {
            setStatus(`connected · ${m.width}×${m.height}${m.visible === false ? ' · hidden by a PadSight rule' : ''}`);
            // PadSight's OBS rules (break scenes, live-only, the hide hotkey). Panel previews ignore them.
            if (params.get('preview') !== '1') document.body.classList.toggle('obs-hidden', m.visible === false);
            if (!m.width) ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        } catch {}
        return;
      }
      pending = ev.data;          // newest frame wins; never queue
      drawLatest();
    };
    let opened = false;
    ws.addEventListener('open', () => { opened = true; });
    ws.onclose = () => {
      setStatus('PadSight not running – retrying…');
      if (!opened && params.has('theme')) {
        // The server is up but refused the socket: almost always a wrong theme path.
        fetch('/status.json', { cache: 'no-store' })
          .then(r => { if (r.ok) setStatus(`Theme not found or failed to load: ${params.get('theme')} – retrying…`); })
          .catch(() => {});
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height); // stay transparent while disconnected
      setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 3000);
    };
    ws.onerror = () => ws.close();
  }
  connect();
})();
</script>
</body>
</html>
