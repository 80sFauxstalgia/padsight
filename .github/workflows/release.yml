# Release build: produces the Windows zip, SHA-256 checksums and (in public repos) a signed
# SLSA build-provenance attestation.
#
# Triggers
#   - push of a tag "v*"   -> builds and attaches everything to a DRAFT GitHub release
#                             (drafts are not public; a maintainer publishes it by hand)
#   - workflow_dispatch     -> dry run: builds and uploads a workflow artifact only
#
# Actions are pinned to full commit SHAs (tag in the trailing comment).
name: Release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write          # only used by the draft-release step on tag pushes
      id-token: write          # attestation: mint the OIDC token for Sigstore
      attestations: write      # attestation: store it on the repository
      artifact-metadata: write # attestation: link it to the artifact
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out (with the ExtendInput submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        # Also downloads the official SDL3 release and verifies its pinned SHA-256 (see VSCView.csproj).
        run: dotnet build VSCView.sln -c Release -nologo -v:minimal

      # ------------------------------------------------------------------------------------------
      # AUTHENTICODE SIGNING SLOT - intentionally disabled.
      # If code signing is approved (e.g. Azure Artifact Signing), sign the built binaries HERE:
      # after the build, before packaging, so the zip, its checksum and the attestation all cover
      # the signed files. Targets: VSCView/bin/Release/net462/VSCView.exe, ThemeFixer.exe,
      # ExtendInput.dll. Credentials would come from repository secrets / OIDC federation.
      # No secrets or signing configuration exist yet; this step never runs.
      - name: Sign binaries (not configured)
        if: ${{ false }}
        run: echo "Authenticode signing is not configured."
      # ------------------------------------------------------------------------------------------

      - name: Package zip
        shell: pwsh
        run: ./tools/package.ps1 -NoBuild

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          Set-Location dist
          Get-ChildItem *.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Artifact attestations are only available for PUBLIC repositories on GitHub Free/Pro/Team
      # (private repositories need Enterprise Cloud), so this step is skipped while the repo is private.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 (successor of attest-build-provenance)
        with:
          subject-path: 'dist/*.zip'

      - name: Note skipped attestation (private repository)
        if: ${{ github.event.repository.private }}
        run: echo "::notice title=Attestation skipped::Build provenance attestations need a public repository on this plan; skipped while the repository is private."

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscview-release
          path: |
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create DRAFT release (tag pushes only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist/*.zip, dist/*.sha256, dist/SHA256SUMS.txt | ForEach-Object FullName)
          gh release create "$env:GITHUB_REF_NAME" --draft --verify-tag --title "VSCView $env:GITHUB_REF_NAME" --notes "Draft created by the release workflow. Review before publishing." @files
